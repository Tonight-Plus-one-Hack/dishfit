<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Plus One logo loop, shot 03: editorial poster, glossy icon mark. Mounted by index.html. -->
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/plus-one.css" />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: var(--canvas);
        }
        #s03-poster {
          position: absolute;
          inset: 0;
        }
        #s03-rail {
          position: absolute;
          left: var(--safe-left);
          right: var(--safe-right);
          top: calc(var(--safe-top) + 22px);
          display: flex;
          justify-content: space-between;
          padding-bottom: 14px;
          border-bottom: 2px solid var(--rule);
          color: var(--muted);
        }
        #s03-photo {
          position: absolute;
          left: var(--safe-left);
          top: calc(var(--safe-top) + 130px);
          width: 240px;
          height: 324px;
          border-radius: 16px;
          background:
            radial-gradient(60% 55% at 30% 80%, var(--art-violet) 0%, rgba(156, 144, 254, 0) 100%),
            radial-gradient(70% 60% at 80% 100%, var(--art-blue) 0%, rgba(53, 94, 218, 0) 100%),
            linear-gradient(180deg, #e8e8ec 0%, #b9c0f8 100%);
        }
        #s03-word {
          position: absolute;
          left: 0;
          right: 0;
          top: calc(var(--mark-cy) + 165px);
          text-align: center;
          font-size: 260px;
          color: var(--ink);
          white-space: nowrap;
        }
        #s03-swatches {
          position: absolute;
          right: var(--safe-right);
          top: calc(var(--safe-top) + 130px);
          display: flex;
          gap: 12px;
        }
        #s03-swatches i {
          display: block;
          width: 64px;
          height: 64px;
          border-radius: 8px;
        }
        #s03-icon {
          filter: drop-shadow(0 24px 32px rgba(53, 94, 218, 0.35));
        }
        #s03-fill {
          background: linear-gradient(160deg, var(--art-violet) 0%, var(--art-periwinkle) 42%, var(--art-blue) 100%);
        }
        #s03-gloss {
          background: linear-gradient(180deg, rgba(255, 255, 255, 0.55) 0%, rgba(255, 255, 255, 0) 46%);
        }
      </style>

      <div id="root" data-composition-id="s03" data-width="1080" data-height="1080">
        <div id="s03-poster">
          <div id="s03-rail" class="mono"><span>Plus One</span><span>Small groups, public spots</span><span>Berlin, 21:00</span></div>
          <div id="s03-photo"></div>
          <div id="s03-word" class="serif" data-layout-allow-overflow data-layout-allow-occlusion>Tonight</div>
          <div id="s03-swatches"><i style="background: #355eda"></i><i style="background: #8391f7"></i><i style="background: #9c90fe"></i><i style="background: #111113"></i></div>
        </div>
        <div id="s03-icon" class="mark">
          <div id="s03-fill" class="shot-layer logo-mask"></div>
          <div id="s03-gloss" class="shot-layer logo-mask"></div>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });

        // The poster pushes in about 5 % while the mark holds still (as in the reference).
        tl.fromTo("#s03-poster", { scale: 1 }, { scale: 1.05, duration: 8 / 30, ease: "none" }, 0);
        window.__timelines["s03"] = tl;
      </script>
    </template>
  </body>
</html>
