<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Plus One logo loop, shot 05: pencil sketch on paper. Mounted by index.html. -->
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/plus-one.css" />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: var(--surface);
        }
        #s05-grain {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          opacity: 0.5;
        }
        #s05-guides {
          position: absolute;
          inset: 0;
          background:
            linear-gradient(90deg, rgba(96, 100, 108, 0) calc(50% - 1px), rgba(96, 100, 108, 0.22) calc(50% - 1px), rgba(96, 100, 108, 0.22) calc(50% + 1px), rgba(96, 100, 108, 0) calc(50% + 1px)),
            linear-gradient(180deg, rgba(96, 100, 108, 0) calc(var(--mark-cy) - 1px), rgba(96, 100, 108, 0.22) calc(var(--mark-cy) - 1px), rgba(96, 100, 108, 0.22) calc(var(--mark-cy) + 1px), rgba(96, 100, 108, 0) calc(var(--mark-cy) + 1px));
        }
        #s05-circle {
          position: absolute;
          left: 50%;
          top: var(--mark-cy);
          width: 560px;
          height: 560px;
          margin: -280px 0 0 -280px;
          border: 2px solid rgba(96, 100, 108, 0.25);
          border-radius: 50%;
        }
        #s05-hatch {
          background: repeating-linear-gradient(-45deg, rgba(28, 32, 36, 0.62) 0 2px, rgba(28, 32, 36, 0) 2px 9px);
        }
        #s05-line {
          filter: url(#s05-pencil);
        }
        #s05-shape {
          background: #000000;
        }
        #s05-note {
          position: absolute;
          left: 0;
          right: 0;
          top: calc(var(--mark-cy) + 300px);
          text-align: center;
          color: var(--muted);
        }
      </style>

      <div id="root" data-composition-id="s05" data-width="1080" data-height="1080">
        <svg width="0" height="0" style="position: absolute" aria-hidden="true">
          <filter id="s05-pencil" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
            <feMorphology in="SourceAlpha" operator="dilate" radius="2" result="d" />
            <feComposite in="d" in2="SourceAlpha" operator="out" result="o" />
            <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="n" />
            <feDisplacementMap in="o" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G" result="w" />
            <feFlood flood-color="#1C2024" flood-opacity="0.9" />
            <feComposite in2="w" operator="in" />
          </filter>
        </svg>
        <svg id="s05-grain" aria-hidden="true">
          <filter id="s05-noise" x="0" y="0" width="100%" height="100%">
            <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="4" />
            <feColorMatrix values="0 0 0 0 0.11  0 0 0 0 0.125  0 0 0 0 0.14  0 0 0 0.16 0" />
          </filter>
          <rect width="100%" height="100%" filter="url(#s05-noise)" />
        </svg>
        <div id="s05-guides"></div>
        <div id="s05-circle"></div>
        <div id="s05-hatch" class="mark logo-mask"></div>
        <div id="s05-line" class="mark"><div id="s05-shape" class="shot-layer logo-mask"></div></div>
        <div id="s05-note" class="mono">Sketch 01: three plus one</div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });
        // Hold: the cut is the motion.
        window.__timelines["s05"] = tl;
      </script>
    </template>
  </body>
</html>
