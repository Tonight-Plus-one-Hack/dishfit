<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Plus One logo loop, shot 12: lockup. Mounted by index.html. -->
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/plus-one.css" />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: var(--canvas);
        }
        #s12-mark {
          background: var(--dark);
        }
        /* Stacked lockup: the brand wordmark at the symbol's width, 64 px below it. */
        #s12-word {
          position: absolute;
          left: 50%;
          top: calc(var(--mark-cy) + 266.5px);
          width: 400px;
          height: 76px;
          margin-left: -200px;
          background: var(--dark);
        }
      </style>

      <div id="root" data-composition-id="s12" data-width="1080" data-height="1080">
        <div id="s12-mark" class="mark logo-mask"></div>
        <div id="s12-word" class="wordmark-mask" role="img" aria-label="Plus One"></div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });
        // Hold: the cut is the motion.
        window.__timelines["s12"] = tl;
      </script>
    </template>
  </body>
</html>
