<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Plus One logo loop, shot 10: construction grid on the dark surface. Mounted by index.html. -->
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/plus-one.css" />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background:
            linear-gradient(90deg, rgba(96, 100, 108, 0) calc(50% - 203.5px), #60646c calc(50% - 203.5px), #60646c calc(50% - 201.5px), rgba(96, 100, 108, 0) calc(50% - 201.5px)),
            linear-gradient(90deg, rgba(96, 100, 108, 0) calc(50% + 201.5px), #60646c calc(50% + 201.5px), #60646c calc(50% + 203.5px), rgba(96, 100, 108, 0) calc(50% + 203.5px)),
            linear-gradient(180deg, rgba(96, 100, 108, 0) calc(var(--mark-cy) - 203.5px), #60646c calc(var(--mark-cy) - 203.5px), #60646c calc(var(--mark-cy) - 201.5px), rgba(96, 100, 108, 0) calc(var(--mark-cy) - 201.5px)),
            linear-gradient(180deg, rgba(96, 100, 108, 0) calc(var(--mark-cy) + 201.5px), #60646c calc(var(--mark-cy) + 201.5px), #60646c calc(var(--mark-cy) + 203.5px), rgba(96, 100, 108, 0) calc(var(--mark-cy) + 203.5px)),
            repeating-linear-gradient(90deg, var(--dark-rule) 0 1px, rgba(54, 58, 63, 0) 1px 45px),
            repeating-linear-gradient(180deg, var(--dark-rule) 0 1px, rgba(54, 58, 63, 0) 1px 45px),
            var(--dark-surface);
        }
        #s10-fill {
          background: rgba(131, 145, 247, 0.42);
        }
        #s10-line {
          filter: url(#s10-edge);
        }
        #s10-shape {
          background: #000000;
        }
        #s10-label {
          position: absolute;
          left: calc(50% - 202.5px);
          top: calc(var(--mark-cy) - 262px);
          color: var(--dark-muted);
        }
      </style>

      <div id="root" data-composition-id="s10" data-width="1080" data-height="1080">
        <svg width="0" height="0" style="position: absolute" aria-hidden="true">
          <filter id="s10-edge" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
            <feMorphology in="SourceAlpha" operator="dilate" radius="2" result="d" />
            <feComposite in="d" in2="SourceAlpha" operator="out" result="o" />
            <feFlood flood-color="#9C90FE" />
            <feComposite in2="o" operator="in" />
          </filter>
        </svg>
        <div id="s10-label" class="mono">Grid 45 px</div>
        <div id="s10-fill" class="mark logo-mask"></div>
        <div id="s10-line" class="mark"><div id="s10-shape" class="shot-layer logo-mask"></div></div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });
        // Hold: the cut is the motion.
        window.__timelines["s10"] = tl;
      </script>
    </template>
  </body>
</html>
