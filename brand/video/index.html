    {"id":"muted","type":"color","label":"Muted ink","default":"#60646C"},
    {"id":"dark","type":"color","label":"Dark canvas","default":"#111113"},
    {"id":"art-blue","type":"color","label":"Artwork blue","default":"#355EDA"},
    {"id":"art-periwinkle","type":"color","label":"Artwork periwinkle","default":"#8391F7"},

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <title>Plus One logo loop</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      /* Plus One tokens (Thayon-derived). The 1080x1920 cut is rendered from this file by scripts/render.mjs. */
      :root {
        --canvas: #fcfcfd;
        --surface: #f9f9fb;
        --surface-hover: #f0f0f3;
        --ink: #1c2024;
        --muted: #60646c;
        --rule: #d9d9e0;
        --dark: #111113;
        --dark-surface: #18191b;
        --dark-rule: #363a3f;
        --dark-ink: #edeef0;
        --dark-muted: #afb3ba;
        --art-blue: #355eda;
        --art-periwinkle: #8391f7;
        --art-violet: #9c90fe;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background: var(--canvas);
      }
      #root {
        width: 100%;
        height: 100%;
      }
      /* Layout anchors every shot positions from. Square: the mark sits dead centre. */
      [data-composition-id="main"] {
        --mark-cy: 540px;
        --safe-top: 43px;
        --safe-right: 43px;
        --safe-bottom: 43px;
        --safe-left: 43px;
      }
      /* Vertical: the mark sits at the centre of the band TikTok, Reels and Shorts all leave
         clear (y 288 to 1248, x 120 to 888), and edge copy stays inside that band. */
      [data-composition-id="main"][data-height="1920"] {
        --mark-cy: 768px;
        --safe-top: 288px;
        --safe-right: 192px;
        --safe-bottom: 672px;
        --safe-left: 120px;
      }
    </style>
  </head>
